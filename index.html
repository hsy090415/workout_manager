<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workout Manager</title><style>body{font-family:system-ui,sans-serif;background:#101319;color:#f2f4f8;max-width:650px;margin:auto;padding:18px}h1{font-size:26px}section{background:#1c222b;border:1px solid #303a47;border-radius:16px;padding:16px;margin:14px 0}input,select,textarea,button{font:inherit;border-radius:9px;padding:11px;box-sizing:border-box}input,select,textarea{background:#101720;color:white;border:1px solid #465160;width:100%}button{background:#7eacff;border:0;color:#101820;font-weight:700;cursor:pointer}button:disabled{opacity:.45}button.alt{background:#303c4b;color:white}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.small{color:#acb8c8;font-size:13px}.set{border-top:1px solid #38414b;padding:12px 0}.hidden{display:none}.exercise{margin:12px 0;padding:12px;border:1px solid #394553;border-radius:12px}label{display:block;margin:8px 0 4px}#status{white-space:pre-wrap;color:#c5e4ff}summary{cursor:pointer;font-weight:700}button{margin:5px 0} .stepper{display:flex;align-items:center;gap:5px}.stepper button{flex:0 0 44px;min-height:46px;font-size:23px;margin:0}.stepper output{flex:1;text-align:center;font-size:23px;font-weight:750;font-variant-numeric:tabular-nums}.exercise-title{font-size:20px;font-weight:750}.progress{height:8px;border-radius:9px;background:#35404e;overflow:hidden}.progress>div{height:100%;background:#7eacff;transition:width .2s}.set-controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}.weight-controls{display:flex;gap:6px}.weight-controls input{min-width:0}.unit-buttons{display:flex;gap:6px}.unit-buttons button{flex:1}.unit-buttons .selected{background:#7eacff;color:#101820}.completed{padding:10px;background:#1d3530;border-radius:10px;margin-top:9px}.muted{opacity:.75}.big-save{width:100%;margin-top:16px;padding:15px}.hint{font-size:12px;color:#adbdcd}.target{font-size:14px;color:#c5d9f8}.exercise{padding:16px}.set-header{font-weight:700;margin:14px 0 10px} </style></head><body><h1>🏋️ Workout Manager</h1><p class="small">PUSH1 → PULL1 → LEG1 → PUSH2 → PULL2 → LEG2 · 휴식일은 순서 유지</p><div id="status"></div><section id="login"><h2>로그인</h2><p class="small">Supabase에서 생성한 개인 계정으로 로그인합니다. 로그인 상태는 이 브라우저에 유지됩니다.</p><label for="email">아이디 (이메일)</label><input id="email" type="email" autocomplete="username" placeholder="이메일 주소"><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" placeholder="비밀번호"><button id="signIn" type="button">로그인</button><p class="hint">최초 계정은 Supabase Dashboard → Authentication → Users → Add user에서 생성하세요. 이 앱에서는 회원가입을 제공하지 않습니다.</p></section><div id="app" class="hidden"><section><div class="row"><strong id="identity"></strong><button class="alt" id="logout">로그아웃</button></div><p id="nextLabel"></p><button id="start">운동 시작</button><button class="alt" id="refresh">새로고침</button></section><section id="sessionBox" class="hidden"><h2 id="sessionTitle"></h2><p class="small">목표 횟수 상한과 RPE가 자동 입력됩니다. 종목을 완료하면 다음 종목으로 넘어갑니다.</p><div class="row"><span class="small">중량 표시 단위</span><div class="unit-buttons"><button id="unitKg" type="button" class="alt">kg</button><button id="unitLb" type="button" class="alt">lb</button></div></div><div id="exercises"></div><label>오늘 메모</label><textarea id="notes" rows="2" placeholder="컨디션, 특이사항"></textarea><button id="finish">오운완 · 운동 종료</button></section><section><h2>최근 운동</h2><div id="history"></div></section></div><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.57.0';
const URL='https://ohvyiijjjmxhhyzyenav.supabase.co',KEY='sb_publishable_IV6eQEbFnzfmwiqmaAlDgg_Utm4CPUR';
const db=createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id),names=['PUSH1','PULL1','LEG1','PUSH2','PULL2','LEG2'];let user=null,routines=[],state=null,session=null,unit=localStorage.getItem('workout_unit')==='lb'?'lb':'kg',draft=null;const LB_PER_KG=2.2046226218;
function msg(s){$('status').textContent=s}function err(e){msg('오류: '+(e?.message||e))}function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function check(q){const {data,error}=await q;if(error)throw error;return data}
async function init(){try{const {data:{user:u}}=await db.auth.getUser();user=u;$('login').classList.toggle('hidden',!!user);$('app').classList.toggle('hidden',!user);if(!user){msg('로그인이 필요합니다.');return}$('identity').textContent=user.email||'로그인됨';await load()}catch(e){err(e)}}
async function load(){routines=await check(db.from('routines').select('id,name,position').eq('user_id',user.id).order('position'));if(!routines.length){const {data,error}=await db.rpc('install_default_workout_routines');if(error)throw error;msg('기본 루틴 '+data+'개를 등록했어요.');routines=await check(db.from('routines').select('id,name,position').eq('user_id',user.id).order('position'))}state=await check(db.from('training_state').select('*').eq('user_id',user.id).single());$('nextLabel').textContent='다음 운동: '+names[state.next_position-1];const active=await check(db.from('workout_sessions').select('*').eq('user_id',user.id).eq('status','in_progress').order('started_at',{ascending:false}).limit(1));session=active[0]||null;$('start').disabled=!!session;if(session)await renderSession();else $('sessionBox').classList.add('hidden');const history=await check(db.from('workout_sessions').select('id,started_at,status,routines(name)').eq('user_id',user.id).order('started_at',{ascending:false}).limit(8));$('history').innerHTML=history.map(x=>`<p>${escapeHtml(new Date(x.started_at).toLocaleString('ko-KR'))} · ${escapeHtml(x.routines?.name||'운동')} · ${escapeHtml(x.status)}</p>`).join('')||'<p class="small">아직 기록이 없습니다.</p>'}
async function start(){try{const routine=routines.find(r=>r.position===state.next_position);if(!routine)throw Error('루틴이 없습니다.');session=await check(db.from('workout_sessions').insert({user_id:user.id,routine_id:routine.id}).select().single());await load();msg('운동을 시작했어요.')}catch(e){err(e)}}
function displayWeight(kg){return unit==='kg'?Number(kg.toFixed(2)):Number((kg*LB_PER_KG).toFixed(2))}
function toKg(value){return unit==='kg'?value:value/LB_PER_KG}
function weightStep(){return unit==='kg'?2.5:5}
function setUnit(next){if(next===unit)return;if(draft&&draft.kg!==''&&Number.isFinite(Number(draft.kg))){const kg=toKg(Number(draft.kg));draft.kg=String(Number((next==='kg'?kg:kg*LB_PER_KG).toFixed(2)))}unit=next;localStorage.setItem('workout_unit',unit);renderSession().catch(err)}
async function renderSession(){
 const routine=routines.find(r=>r.id===session.routine_id);
 $('sessionTitle').textContent=(routine?.name||'운동')+' · 진행 중';$('sessionBox').classList.remove('hidden');
 $('unitKg').className=unit==='kg'?'selected':'alt';$('unitLb').className=unit==='lb'?'selected':'alt';
 const items=await check(db.from('routine_exercises').select('id,exercise_id,position,target_sets,reps_min,reps_max,target_rpe,target_kg,exercises(name)').eq('routine_id',session.routine_id).order('position'));
 const saved=await check(db.from('workout_sets').select('*').eq('session_id',session.id));
 const box=$('exercises');box.replaceChildren();
 const complete=items.filter(x=>saved.filter(s=>s.exercise_id===x.exercise_id).length>=x.target_sets).length;
 const progress=document.createElement('p');progress.className='small';progress.textContent=`종목 진행 ${complete}/${items.length}`;box.append(progress);
 const bar=document.createElement('div');bar.className='progress';bar.innerHTML=`<div style="width:${items.length?100*complete/items.length:0}%"></div>`;box.append(bar);
 const x=items.find(x=>saved.filter(s=>s.exercise_id===x.exercise_id).length<x.target_sets);
 if(!x){const done=document.createElement('div');done.className='completed';done.textContent='모든 종목의 목표 세트를 완료했어요. 아래 오운완 버튼을 눌러 종료하세요.';box.append(done);return}
 const rows=saved.filter(s=>s.exercise_id===x.exercise_id).sort((a,b)=>a.set_number-b.set_number);
 const next=rows.length+1;
 const key=`${session.id}:${x.id}:${next}`;
 if(!draft||draft.key!==key){draft={key,kg:x.target_kg==null?'':String(displayWeight(Number(x.target_kg))),reps:x.reps_max,rpe:x.target_rpe??8}}
 const div=document.createElement('div');div.className='exercise';
 div.innerHTML=`<div class="exercise-title">${escapeHtml(x.exercises.name)}</div><p class="target">목표 ${x.target_sets}세트 × ${x.reps_min===x.reps_max?x.reps_min:x.reps_min+'~'+x.reps_max}회 · RPE ${x.target_rpe??'-'} ${x.target_kg==null?'· 중량 미설정':'· '+displayWeight(Number(x.target_kg))+' '+unit}</p><p class="set-header">${next} / ${x.target_sets} 세트</p><div class="set-controls"><div><label>반복 횟수</label><div class="stepper"><button type="button" class="alt reps-minus" aria-label="반복 1회 감소">−</button><output class="reps-value"></output><button type="button" class="alt reps-plus" aria-label="반복 1회 증가">+</button></div></div><div><label>RPE</label><div class="stepper"><button type="button" class="alt rpe-minus" aria-label="RPE 0.5 감소">−</button><output class="rpe-value"></output><button type="button" class="alt rpe-plus" aria-label="RPE 0.5 증가">+</button></div></div></div><label>중량 (${unit})</label><div class="weight-controls"><button type="button" class="alt kg-minus" aria-label="중량 감소">−</button><input class="kg" type="number" min="0" step="any" inputmode="decimal" placeholder="중량 입력" aria-label="중량 (${unit})"><button type="button" class="alt kg-plus" aria-label="중량 증가">+</button></div>${x.target_kg==null?'<p class="hint">첫 세트를 저장하면 입력한 중량을 이 종목의 목표 중량으로 등록합니다.</p>':''}<div class="saved"></div><button class="save big-save">${next}세트 저장 · 다음으로</button>`;
 box.append(div);
 const kgInput=div.querySelector('.kg');kgInput.value=draft.kg;
 function update(){div.querySelector('.reps-value').textContent=draft.reps;div.querySelector('.rpe-value').textContent=Number(draft.rpe).toFixed(1);div.querySelector('.reps-minus').disabled=draft.reps<=0;div.querySelector('.reps-plus').disabled=draft.reps>=200;div.querySelector('.rpe-minus').disabled=draft.rpe<=1;div.querySelector('.rpe-plus').disabled=draft.rpe>=10}
 for(const [cls,field,delta,min,max] of [['reps-minus','reps',-1,0,200],['reps-plus','reps',1,0,200],['rpe-minus','rpe',-.5,1,10],['rpe-plus','rpe',.5,1,10]])div.querySelector('.'+cls).onclick=()=>{draft[field]=Math.max(min,Math.min(max,draft[field]+delta));update()};
 for(const [cls,delta] of [['kg-minus',-1],['kg-plus',1]])div.querySelector('.'+cls).onclick=()=>{const v=Number(kgInput.value||0);draft.kg=String(Number(Math.max(0,v+delta*weightStep()).toFixed(2)));kgInput.value=draft.kg};
 kgInput.oninput=()=>{draft.kg=kgInput.value};update();
 div.querySelector('.saved').innerHTML=rows.map(s=>`<div class="completed small">✓ ${s.set_number}세트 · ${displayWeight(Number(s.weight_kg))} ${unit} × ${s.reps}회 · RPE ${s.rpe??'-'}</div>`).join('');
 div.querySelector('.save').onclick=async()=>{const button=div.querySelector('.save');try{
 const weight=Number(draft.kg),reps=Number(draft.reps),rpe=Number(draft.rpe);
 if(draft.kg===''||!Number.isFinite(weight)||weight<0||!Number.isInteger(reps)||reps<0||reps>200||!Number.isFinite(rpe)||rpe<1||rpe>10||rpe*2%1!==0)throw Error('중량·반복·RPE를 확인하세요.');
 button.disabled=true;const kg=Number(toKg(weight).toFixed(2));
 await check(db.from('workout_sets').insert({user_id:user.id,session_id:session.id,exercise_id:x.exercise_id,set_number:next,weight_kg:kg,reps,rpe}));
 if(x.target_kg==null){try{await check(db.from('routine_exercises').update({target_kg:kg}).eq('id',x.id).eq('user_id',user.id).is('target_kg',null))}catch(e){msg('세트는 저장됐지만 목표 중량 등록에 실패했어요: '+e.message)}}
 draft=null;await renderSession();msg(`${x.exercises.name} ${next}세트 저장 완료`);
 }catch(e){button.disabled=false;err(e)}};
}
$('unitKg').onclick=()=>setUnit('kg');$('unitLb').onclick=()=>setUnit('lb');
async function finish(){try{if(!confirm('운동을 완료하고 다음 루틴으로 이동할까요?'))return;const sets=await check(db.from('workout_sets').select('id').eq('session_id',session.id).limit(1));if(!sets.length)throw Error('최소 1세트를 기록해야 종료할 수 있어요.');await check(db.from('workout_sessions').update({status:'completed',ended_at:new Date().toISOString(),notes:$('notes').value}).eq('id',session.id).eq('user_id',user.id));const current=routines.find(r=>r.id===session.routine_id);await check(db.from('training_state').update({next_position:(current.position%6)+1,last_session_id:session.id,updated_at:new Date().toISOString()}).eq('user_id',user.id));session=null;$('notes').value='';await load();msg('오운완! 기록이 저장됐어요.')}catch(e){err(e)}}
$('signIn').onclick=async()=>{const button=$('signIn');try{const email=$('email').value.trim(),password=$('password').value;if(!email||!password)throw Error('이메일과 비밀번호를 입력하세요.');button.disabled=true;const {error}=await db.auth.signInWithPassword({email,password});if(error)throw error;$('password').value='';await init()}catch(e){err(e)}finally{button.disabled=false}};$('password').addEventListener('keydown',e=>{if(e.key==='Enter')$('signIn').click()});$('logout').onclick=async()=>{await db.auth.signOut();await init()};$('start').onclick=start;$('refresh').onclick=()=>load().catch(err);$('finish').onclick=finish;db.auth.onAuthStateChange((_event,s)=>{if(s?.user?.id!==user?.id)setTimeout(init,0)});await init();
</script></body></html>
